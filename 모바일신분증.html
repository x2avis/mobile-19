  <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 신분증</title>
    <style>
        :root {
            --bg-color: #f2f2f2;
            --card-bg: #ffffff;
            --time-gradient: linear-gradient(90deg, #6EA9F5 0%, #5B40F7 100%);
            --timer-grey: #a0a0a0;
            --timer-blue: #5e9fff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* 전체 스크롤 방지 */
        }

        /* [수정] 아이폰 12 mini 비율에 맞춘 컨테이너 */
        .container {
            width: 375px;
            height: 100vh; /* 화면 높이에 딱 맞춤 */
            max-height: 812px;
            background-color: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        header {
            position: relative;
            padding: 10px 20px 0 20px;
            text-align: center;
            background-color: #fff;
            z-index: 10;
        }

        .back-arrow {
            position: absolute;
            left: 20px;
            top: 12px;
            cursor: pointer;
        }

        .header-title {
            font-size: 16px;
            font-weight: 300;
            margin-bottom: 10px; 
        }

        .nav-tabs {
            display: flex;
            flex-direction: row;
            padding-left: 5px;
            gap: 25px;
            font-size: 15px;
            color: #bbb;
            font-weight: 300;
        }

        .nav-tabs .tab-item {
            cursor: pointer;
            padding-bottom: 8px;
            margin-top: 1px; 
        }

        .nav-tabs .active {
            color: #000;
            font-weight: 500;
            border-bottom: 3px solid #333;
            line-height: 1.1;
        }

        .hamburger {
            position: absolute;
            right: 20px;
            top: 12px;
            cursor: pointer;
        }

        /* [수정] 아래 여백 없이 꽉 차도록 설정 */
        .card-wrapper {
            flex: 1;
            padding: 20px;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            padding-top: 20px; 
        }

        .id-card {
            width: 290px;
            height: 440px;
            background: var(--card-bg);
            border-radius: 10px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .profile-img {
            width: 110px;
            height: 140px;
            margin: 0 auto 5px;
            display: block;
            object-fit: cover;
        }

        .info-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            min-height: 125px; 
            margin-top: 10px;
        }

        .user-data { 
            flex: 1; 
            padding-right: 5px; 
        }

        .name { font-size: 20px; font-weight: bold; margin-bottom: 6px; }

        .birth { 
            font-size: 13px; 
            font-weight: 700; 
            margin-bottom: 4px; 
            margin-top: 15px; 
        }

        .address { 
            font-size: 11px; 
            color: #444; 
            line-height: 1.3; 
            margin-top: -2px; 
        }
        .dots { letter-spacing: 3px; font-weight: bold; }

        .qr-image {
            width: 105px;
            height: 105px;
            margin-top: 5px;
            flex-shrink: 0;
        }

        .toggle-area {
            height: 105px; 
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .toggle-btn {
            width: 42px;
            height: 24px;
            background: #eee;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }

        .toggle-btn.on { background: #333; }
        .toggle-circle {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }
        .toggle-btn.on .toggle-circle { left: 20px; }

        .issuer {
            font-size: 11px;
            color: #bbb;
            margin-bottom: 10px;
            text-align: left;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: var(--time-gradient);
            transform-origin: left;
            animation: timer 30s linear infinite;
        }

        .reset-anim { animation: none !important; }

        @keyframes timer {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }

        .timer-text {
            font-size: 11px;
            color: var(--timer-grey);
            margin-bottom: 5px;
        }
        .timer-text span {
            color: var(--timer-blue);
            font-weight: bold;
        }

        .bottom-btn {
            width: 100%;
            height: 52px; 
            background: #222;
            color: white;
            border: none;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            font-size: 14px;
            font-weight: 300; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0; /* 버튼 크기 유지 */
        }

        .hidden { visibility: hidden; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="back-arrow">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </div>
        <div class="header-title">모바일신분증</div>
        <div class="nav-tabs">
            <div class="tab-item active">주민등록증</div>
            <div class="tab-item">운전면허증</div>
        </div>
        <div class="hamburger">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </header>

    <div class="card-wrapper">
        <div class="id-card">
            <div class="card-content">
                <img src="https://i.ibb.co/TDBxdLR6/3-5-4-5cm.jpg" alt="프로필" class="profile-img">
                
                <div class="info-section">
                    <div class="user-data" id="userData"></div>
                    <div id="actionArea"></div>
                </div>

                <div class="bottom-info-area">
                    <div id="issuerArea" class="issuer">울산광역시 북구청장</div>
                    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
                    <div class="timer-text">남은시간 <span id="timerCount">30초</span></div>
                </div>
            </div>
            <button class="bottom-btn" id="mainBtn" onclick="toggleMode()">상세정보 표시</button>
        </div>
    </div>
</div>

<script>
    let isQRMode = true; 
    let isDetailOn = false;
    let timeLeft = 30;

    const userData = document.getElementById('userData');
    const actionArea = document.getElementById('actionArea');
    const mainBtn = document.getElementById('mainBtn');
    const issuerArea = document.getElementById('issuerArea');
    const timerCount = document.getElementById('timerCount');
    const progressBar = document.getElementById('progressBar');

    function startTimer() {
        setInterval(() => {
            timeLeft--;
            if (timeLeft < 0) {
                timeLeft = 30;
                progressBar.classList.add('reset-anim');
                void progressBar.offsetWidth;
                progressBar.classList.remove('reset-anim');
            }
            timerCount.innerText = timeLeft + "초";
        }, 1000);
    }

    function render() {
        if (isQRMode) {
            userData.innerHTML = `<div class="name">문주빈</div><div class="birth">07.11.08</div><div class="address">울산광역시 북구</div>`;
            actionArea.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=105x105&data=LeeYeJi" class="qr-image">`;
            mainBtn.innerText = "상세정보 표시";
            issuerArea.classList.add('hidden');
        } else {
            issuerArea.classList.remove('hidden');
            if (!isDetailOn) {
                userData.innerHTML = `<div class="name">문주빈</div><div class="birth">071108 - <span class="dots">•••••••</span></div><div class="address">울산광역시 북구</div><div class="address dots">••••••••••••••</div>`;
            } else {
                userData.innerHTML = `<div class="name">문주빈</div><div class="birth">071108 - 4220219</div><div class="address">울산광역시 북구 천곡길 165</div><div class="address">102동 1204호 농소대동한마음타운</div>`;
            }
            actionArea.innerHTML = `<div class="toggle-area"><div class="toggle-btn ${isDetailOn ? 'on' : ''}" onclick="toggleDetail(evet)"><div clanss="toggle-circle"></div></div></div>`;
            mainBtn.innerText = "QR정보 표시";
        }
    }

    function toggleMode() { isQRMode = !isQRMode; render(); }
    function toggleDetail(e) { e.stopPropagation(); isDetailOn = !isDetailOn; render(); }

    render();
    startTimer();
</script>

</body>
</html>
    
  </body>
  
</html>
